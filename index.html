const DATA={"yesterday":[],"week":[],"rookgaard":[]};let period='yesterday',sort='xp',direction=-1;const $=id=>document.getElementById(id),number=new Intl.NumberFormat('en-US'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const group=v=>['K','EK'].includes(v)?'knight':['P','RP'].includes(v)?'paladin':['S','MS'].includes(v)?'sorcerer':['D','ED'].includes(v)?'druid':'none';const signed=n=>(n>0?'+':'')+number.format(n);function render(){const base=[...DATA[period]].sort((a,b)=>b.xp-a.xp).slice(0,50),positive=base.reduce((n,p)=>n+Math.max(0,p.xp),0),leader=[...base].sort((a,b)=>b.xp-a.xp)[0];$('players').textContent=base.length;$('xp-total').textContent=base.length?number.format(positive):'—';$('leader').textContent=leader?.name||'—';$('leader-xp').textContent=leader?signed(leader.xp)+' experience':'Awaiting official data';$('period-label').textContent=period==='week'?'Last 7 days · mainland':period==='rookgaard'?'Yesterday · Rookgaard':'Yesterday · mainland';$('source-link').href='https://opentibia.info/stats/'+(period==='week'?'powergamers7':period==='rookgaard'?'powergamers/1/rookgaard':'powergamers');const ranks=new Map([...base].sort((a,b)=>b.xp-a.xp).map((p,i)=>[p.name,i+1]));const filtered=base.filter(p=>($('vocation').value==='all'||group(p.vocation)===$('vocation').value)).sort((a,b)=>direction*(sort==='name'?a.name.localeCompare(b.name):a[sort]-b[sort])||a.name.localeCompare(b.name));$('shown').textContent=filtered.length+' of '+base.length+' players';$('ranking').innerHTML=filtered.map(p=>`<tr data-rank="${ranks.get(p.name)}"><td><span data-rank="${ranks.get(p.name)}" class="rank ${ranks.get(p.name)<=3?'top':''}">${String(ranks.get(p.name)).padStart(2,'0')}</span></td><td><a class="player" href="${esc(p.url)}">${esc(p.name)}</a></td><td><span class="vocation">${esc(p.vocation)}</span></td><td class="number">${p.level}</td><td class="number ${p.change>0?'gain':p.change<0?'negative':'zero'}">${signed(p.change)}</td><td class="number"><div class="xp-wrap"><span class="xp-bar" aria-hidden="true"><i style="width:${Math.max(0,Math.min(100,p.xp/(leader?.xp||1)*100))}%"></i></span><span class="xp ${p.xp<0?'negative':''}">${signed(p.xp)}</span></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Rankings coming soon. Awaiting the official experience-gain API.</td></tr>';document.querySelectorAll('[data-sort]').forEach(b=>{b.parentElement.setAttribute('aria-sort',b.dataset.sort===sort?(direction===1?'ascending':'descending'):'none')})}document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{if(sort===b.dataset.sort)direction*=-1;else{sort=b.dataset.sort;direction=sort==='name'?1:-1}render()});$('vocation').onchange=render;render();
</script></body></html>
